# A tag `vX.Y.Z` becomes a GitHub Release carrying the three store zips and
# that version's CHANGELOG section. The tag is the owner's word; this file
# only turns it into a page. npm publishes, the store uploads and the site
# deploy stay in his hands.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # The tag must spell the version the tree carries, or the zips would be
      # named for one release and tagged as another.
      - name: The tag matches the version
        run: |
          VERSION="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "tag $TAG, tree version $VERSION" >&2
            exit 1
          fi
          grep -q "^## $VERSION " CHANGELOG.md || { echo "CHANGELOG.md has no '## $VERSION' section" >&2; exit 1; }
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
      - run: npm run package
      # The CHANGELOG section for this version, heading excluded: from the line
      # after `## X.Y.Z` to the line before the next `## `.
      - name: Release notes from the CHANGELOG
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "sidewalk ${TAG#v}" \
            --notes-file notes.md \
            packages/extension/store/sidewalk-chrome-${TAG#v}.zip \
            packages/extension/store/sidewalk-firefox-${TAG#v}.zip \
            packages/extension/store/sidewalk-source-${TAG#v}.zip
