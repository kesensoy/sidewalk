# A tag `vX.Y.Z` becomes a GitHub Release carrying the three store zips and
# that version's CHANGELOG section. The tag is the owner's word; this file
# only turns it into a page. npm publishes, the store uploads and the site
# deploy stay in his hands.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      # The tag must spell the version the tree carries, or the zips would be
      # named for one release and tagged as another.
      - name: The tag matches the version
        run: |
          VERSION="$(node -p "require('./plugin/.claude-plugin/plugin.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "tag $TAG, tree version $VERSION" >&2
            exit 1
          fi
          grep -q "^## $VERSION " CHANGELOG.md || { echo "CHANGELOG.md has no '## $VERSION' section" >&2; exit 1; }
      - run: npm run build
      - run: npm test
      - run: npm run pack:check
      - run: npm run package
      # The CHANGELOG section for this version, heading excluded: from the line
      # after `## X.Y.Z` to the line before the next `## `.
      - name: Release notes from the CHANGELOG
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      # A tag gets moved: a CI fix lands, the tag is force-pushed onto it, and
      # this workflow runs a second time for a release that already exists.
      # So the first run creates the page and every run after brings it up to
      # date — the zips replaced, the notes and title rewritten from the tree
      # the tag now points at. The release follows the tag, so nothing here has
      # to chase the commit.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          TITLE="sidewalk $VERSION"
          set -- \
            "packages/extension/store/sidewalk-chrome-$VERSION.zip" \
            "packages/extension/store/sidewalk-firefox-$VERSION.zip" \
            "packages/extension/store/sidewalk-source-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — updating it"
            gh release upload "$TAG" "$@" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md "$@"
          fi
