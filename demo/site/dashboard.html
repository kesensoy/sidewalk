<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="lp-24">
<title>Lamppost — Dashboard</title>
<script>try { const t = localStorage.getItem("lp-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/styles.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <a class="brand" href="/">Lamppost</a>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/dashboard" aria-current="page">Dashboard</a>
      <a href="/history">History</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>

  <main>
    <h1>Dashboard</h1>

    <p class="banner" id="banner" hidden>Under maintenance. Lamps stay amber until you turn this off.</p>

    <div class="lamps" data-lamps></div>

    <div class="control-row" data-walk="lock">
      <label class="switch">
        <input type="checkbox" id="maintenance">
        <span class="track"><span class="knob"></span></span>
        <span class="switch-label">Maintenance</span>
      </label>
    </div>

    <div class="control-row">
      <button id="post" data-walk="post">Post an update</button>
      <button id="share" data-walk="share">Copy status link</button>
    </div>

    <div class="posted-list" id="posted"></div>

    <section>
      <h2>Theme</h2>
      <div class="theme-buttons" data-walk="theme">
        <button data-theme-set="system">System</button>
        <button data-theme-set="light">Light</button>
        <button data-theme-set="dark">Dark</button>
      </div>
    </section>
  </main>
</div>
</body>
</html>
